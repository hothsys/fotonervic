# App configuration, read by server.sh, backend/config.py, the launchers, and
# launcher/build-app.sh. Shell syntax: KEY="value", no spaces around "=".

# File and bundle name: the generated macOS launchers are <APP_NAME>.app and
# <APP_NAME>.command. After changing it, run launcher/build-app.sh to
# regenerate them.
APP_NAME="FotoNerveShatter"

# Name people read: page heading, browser tab, launcher dialogs, server.sh
# messages, startup banner. Optional; defaults to APP_NAME.
APP_TITLE="Foto Nerve Shatter"

# Default port, shared by the launchers and server.sh. The launcher checks this
# port globally, so opening a second copy of the project opens the copy that is
# already running instead of failing with "port already in use".
PORT=5900

# Where Blur Check downloads its AI quality model (models/clipiqa_plus_rn50.onnx,
# ~146 MB, too big for git). Attach that file to a GitHub release with this tag.
QUALITY_MODEL_URL="https://github.com/hothsys/fotonervic/releases/download/quality-model-v1/clipiqa_plus_rn50.onnx"
